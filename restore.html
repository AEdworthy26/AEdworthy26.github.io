  ls("ph_recipes_v1", "[{\"id\":\"mozhpe9lsgcm\",\"sugId\":\"sug1\",\"title\":\"Taiwanese Beef Noodle Soup (\u7d05\u71d2\u725b\u8089\u9eb5) with Pickled Mustard Greens & Chilli Oil\",\"category\":\"Beef\",\"desc\":\"Taiwan's most beloved comfort food: thick-cut beef shin braised low and slow in a deeply savoury broth of soy, doubanjiang, star anise and rice wine until meltingly tender. Ladled over springy wheat noodles with pickled mustard greens cutting through the richness, a drizzle of chilli oil and a scatter of spring onions, this is the kind of bowl that stops a conversation completely.\",\"time\":\"2 hrs 15 mins\",\"serves\":\"4\",\"ingredientGroups\":[{\"group\":\"Beef & Broth\",\"items\":[{\"name\":\"Beef shin, cut into 4cm chunks\",\"quantity\":900,\"unit\":\"g\"},{\"name\":\"Beef stock\",\"quantity\":1.5,\"unit\":\"litres\"},{\"name\":\"Shaoxing rice wine\",\"quantity\":4,\"unit\":\"tbsp\"},{\"name\":\"Light soy sauce\",\"quantity\":4,\"unit\":\"tbsp\"},{\"name\":\"Dark soy sauce\",\"quantity\":2,\"unit\":\"tbsp\"},{\"name\":\"Doubanjiang (spicy bean paste)\",\"quantity\":2,\"unit\":\"tbsp\"},{\"name\":\"Tomato paste\",\"quantity\":1,\"unit\":\"tbsp\"},{\"name\":\"Star anise\",\"quantity\":3,\"unit\":\"\"},{\"name\":\"Cinnamon stick\",\"quantity\":1,\"unit\":\"\"},{\"name\":\"Dried red chillies\",\"quantity\":3,\"unit\":\"\"},{\"name\":\"Rock sugar or soft brown sugar\",\"quantity\":1,\"unit\":\"tbsp\"}]},{\"group\":\"Aromatics\",\"items\":[{\"name\":\"Garlic cloves, smashed\",\"quantity\":6,\"unit\":\"\"},{\"name\":\"Fresh ginger, sliced\",\"quantity\":30,\"unit\":\"g\"},{\"name\":\"Spring onions\",\"quantity\":4,\"unit\":\"\"},{\"name\":\"Neutral oil\",\"quantity\":2,\"unit\":\"tbsp\"}]},{\"group\":\"To Serve\",\"items\":[{\"name\":\"Thick wheat noodles (or udon)\",\"quantity\":400,\"unit\":\"g\"},{\"name\":\"Pickled mustard greens (zha cai), roughly chopped\",\"quantity\":80,\"unit\":\"g\"},{\"name\":\"Spring onions, thinly sliced\",\"quantity\":3,\"unit\":\"\"},{\"name\":\"Chilli oil\",\"quantity\":2,\"unit\":\"tbsp\"},{\"name\":\"Fresh coriander\",\"quantity\":1,\"unit\":\"small bunch\"}]}],\"substitutes\":[{\"ingredient\":\"Beef shin\",\"alternatives\":[\"Beef brisket\",\"Beef cheek\"]},{\"ingredient\":\"Doubanjiang\",\"alternatives\":[\"Gochujang + a pinch of salt\",\"Chilli bean paste\"]},{\"ingredient\":\"Shaoxing rice wine\",\"alternatives\":[\"Dry sherry\",\"Mirin (use half the quantity)\"]},{\"ingredient\":\"Pickled mustard greens\",\"alternatives\":[\"Kimchi\",\"Quick-pickled cabbage with rice vinegar\"]}],\"instructions\":[\"Step 1 \u2014 Pat the beef shin pieces dry with kitchen paper and season generously with salt. Heat the neutral oil in a large heavy-bottomed pot or Dutch oven over high heat. Sear the beef in batches for 3\u20134 minutes per side until deeply browned on all surfaces. Do not crowd the pan. Transfer the browned beef to a plate and set aside.\",\"Step 2 \u2014 Reduce the heat to medium. In the same pot, add the smashed garlic, sliced ginger and the white parts of the spring onions. Fry for 90 seconds, stirring, until fragrant and lightly golden. Add the doubanjiang and tomato paste and stir-fry for 1 minute until the paste darkens and smells toasty.\",\"Step 3 \u2014 Pour in the Shaoxing rice wine and let it bubble and reduce for 30 seconds, scraping up any browned bits from the bottom of the pot. Add the light soy sauce, dark soy sauce, rock sugar, star anise, cinnamon stick and dried red chillies. Stir to combine.\",\"Step 4 \u2014 Return the seared beef to the pot and pour in the beef stock. The liquid should just cover the meat \u2014 top up with water if needed. Bring to a boil, skim off any foam that rises to the surface, then reduce the heat to a very gentle simmer. Cover partially with a lid and braise for 1 hour 45 minutes to 2 hours, until the beef is completely tender and yields easily when pressed with a spoon.\",\"Step 5 \u2014 Fish out and discard the whole spices. Taste the broth and adjust seasoning \u2014 add more soy for saltiness, a pinch more sugar for balance. The broth should be deeply savoury, lightly spiced and rich. If it tastes thin, increase heat and simmer uncovered for 10 minutes to reduce slightly.\",\"Step 6 \u2014 Cook the wheat noodles according to packet instructions until just tender but still with a little bite. Drain and divide among four deep bowls.\",\"Step 7 \u2014 Ladle the hot broth generously over the noodles, then arrange several chunks of braised beef on top. Scatter over the pickled mustard greens, sliced spring onions and fresh coriander. Finish with a drizzle of chilli oil and serve immediately, with extra chilli oil on the side.\"],\"rating\":0,\"favourite\":false,\"createdAt\":1778400440697,\"emoji\":\"\ud83c\udf5c\",\"image\":\"https://images.pexels.com/photos/31623304/pexels-photo-31623304.jpeg?auto=compress&cs=tinysrgb&dpr=2&h=650&w=940\",\"calories\":610,\"protein\":42,\"fibre\":5,\"healthScore\":68},{\"id\":\"moyhkw6ppnm0\",\"sugId\":\"sug2\",\"title\":\"Japanese Katsu Curry Udon with Crispy Panko Chicken & Soft-Boiled Egg\",\"category\":\"Chicken\",\"desc\":\"Thick, bouncy udon noodles swim in a velvety Japanese curry broth \u2014 mild, warming, and subtly sweet \u2014 topped with a shattering-crisp panko chicken cutlet and a jammy soft-boiled egg. This is the kind of deeply satisfying bowl that feels like pure comfort food, with every element pulling its weight.\",\"time\":\"40 mins\",\"serves\":\"2\",\"ingredientGroups\":[{\"group\":\"Crispy Chicken\",\"items\":[{\"name\":\"Boneless skinless chicken breasts, halved horizontally to create thin fillets\",\"quantity\":2,\"unit\":\"\"},{\"name\":\"Panko breadcrumbs\",\"quantity\":80,\"unit\":\"g\"},{\"name\":\"Plain flour\",\"quantity\":3,\"unit\":\"tbsp\"},{\"name\":\"Egg, beaten\",\"quantity\":1,\"unit\":\"\"},{\"name\":\"Neutral oil (vegetable or sunflower), for shallow frying\",\"quantity\":4,\"unit\":\"tbsp\"},{\"name\":\"Salt and white pepper\",\"quantity\":0,\"unit\":\"to taste\"}]},{\"group\":\"Curry Udon Broth\",\"items\":[{\"name\":\"Fresh or vacuum-packed udon noodles\",\"quantity\":400,\"unit\":\"g\"},{\"name\":\"Japanese curry roux block (S&B Golden Curry or similar)\",\"quantity\":2,\"unit\":\"cubes (approx 40g)\"},{\"name\":\"Dashi stock (or light chicken stock)\",\"quantity\":700,\"unit\":\"ml\"},{\"name\":\"Soy sauce\",\"quantity\":1,\"unit\":\"tbsp\"},{\"name\":\"Mirin\",\"quantity\":1,\"unit\":\"tbsp\"},{\"name\":\"Brown onion, thinly sliced\",\"quantity\":1,\"unit\":\"\"},{\"name\":\"Neutral oil\",\"quantity\":1,\"unit\":\"tbsp\"}]},{\"group\":\"To Serve\",\"items\":[{\"name\":\"Eggs\",\"quantity\":2,\"unit\":\"\"},{\"name\":\"Spring onions, thinly sliced\",\"quantity\":2,\"unit\":\"\"},{\"name\":\"Toasted sesame seeds\",\"quantity\":1,\"unit\":\"tsp\"},{\"name\":\"Shichimi togarashi or chilli flakes (optional)\",\"quantity\":0,\"unit\":\"to taste\"}]}],\"substitutes\":[{\"ingredient\":\"Japanese curry roux block\",\"alternatives\":[\"1 tbsp curry powder mixed with 1 tsp cornflour and 1 tsp honey for a rougher approximation\",\"Thai Massaman paste (different but equally good)\"]},{\"ingredient\":\"Udon noodles\",\"alternatives\":[\"Thick ramen noodles\",\"Soba noodles\"]},{\"ingredient\":\"Dashi stock\",\"alternatives\":[\"Light chicken stock\",\"Vegetable stock with a splash of soy sauce\"]}],\"instructions\":[\"Step 1 \u2014 Bring a small saucepan of water to a boil. Gently lower in the eggs and cook for exactly 6\u00bd minutes for jammy, slightly soft yolks. Transfer to a bowl of iced water, peel carefully once cool, and set aside.\",\"Step 2 \u2014 Season the thin chicken fillets with salt and white pepper. Set up a breading station: flour in one shallow dish, beaten egg in another, panko in a third. Coat each fillet first in flour (shaking off excess), then egg, then press firmly into the panko so it's thoroughly coated.\",\"Step 3 \u2014 Heat the oil for the broth in a medium saucepan over a medium-low heat. Add the sliced onion and cook for 10 minutes, stirring occasionally, until soft and golden. Pour in the dashi stock, soy sauce, and mirin. Bring to a gentle simmer.\",\"Step 4 \u2014 Break the curry roux cubes into the simmering broth and stir until completely dissolved \u2014 the broth will thicken to a silky, gently spiced consistency. Keep warm on a low heat, stirring occasionally.\",\"Step 5 \u2014 Heat the 4 tablespoons of oil in a frying pan over a medium-high heat. Shallow-fry the breaded chicken for 3\u20134 minutes per side until deeply golden and crisp. The panko should be uniformly golden. Transfer to a wire rack or kitchen paper and rest for 2 minutes, then slice diagonally.\",\"Step 6 \u2014 Cook the udon noodles according to packet instructions (usually just 1\u20132 minutes in boiling water for fresh noodles). Drain and divide between two deep bowls.\",\"Step 7 \u2014 Ladle the hot curry broth generously over the noodles. Arrange the sliced katsu chicken on top and halve the soft-boiled eggs, nestling them alongside. Scatter with spring onions, sesame seeds, and a pinch of shichimi if using. Serve immediately.\"],\"rating\":0,\"favourite\":false,\"createdAt\":1778339764465,\"emoji\":\"\ud83c\udf5c\",\"image\":\"https://images.pexels.com/photos/20127885/pexels-photo-20127885.jpeg?auto=compress&cs=tinysrgb&dpr=2&h=650&w=940\",\"calories\":680,\"protein\":38,\"fibre\":3,\"healthScore\":55},{\"id\":\"movj8e2usb5s\",\"sugId\":\"sug2\",\"title\":\"Colombian Bandeja Paisa \u2014 Rice, Crispy Chicharr\u00f3n, Black Beans, Fried Egg & Aj\u00ed Verde\",\"category\":\"Pork\",\"desc\":\"Colombia's most iconic platter, bandeja paisa is the ultimate feast-on-a-plate: crispy pork belly strips, silky black beans, fluffy white rice, a perfectly fried egg and a bright, herbaceous aj\u00ed verde sauce that cuts through everything beautifully. It's bold, satisfying, deeply comforting and comes together from mostly pantry staples \u2014 the aj\u00ed verde alone is worth making by the jarful.\",\"time\":\"55 mins\",\"serves\":\"2\",\"ingredientGroups\":[{\"group\":\"Crispy Chicharr\u00f3n\",\"items\":[{\"name\":\"Pork belly strips, skin on, about 2cm thick\",\"quantity\":300,\"unit\":\"g\"},{\"name\":\"Salt\",\"quantity\":1,\"unit\":\"tsp\"},{\"name\":\"Ground cumin\",\"quantity\":0.5,\"unit\":\"tsp\"},{\"name\":\"Bicarbonate of soda (rubbed on the skin)\",\"quantity\":0.5,\"unit\":\"tsp\"},{\"name\":\"Neutral oil, for frying\",\"quantity\":2,\"unit\":\"tbsp\"}]},{\"group\":\"Black Beans\",\"items\":[{\"name\":\"Tinned black beans, drained and rinsed\",\"quantity\":400,\"unit\":\"g\"},{\"name\":\"White onion, finely diced\",\"quantity\":0.5,\"unit\":\"\"},{\"name\":\"Garlic cloves, minced\",\"quantity\":2,\"unit\":\"\"},{\"name\":\"Ground cumin\",\"quantity\":1,\"unit\":\"tsp\"},{\"name\":\"Smoked paprika\",\"quantity\":0.5,\"unit\":\"tsp\"},{\"name\":\"Chicken or vegetable stock\",\"quantity\":150,\"unit\":\"ml\"},{\"name\":\"Olive oil\",\"quantity\":1,\"unit\":\"tbsp\"},{\"name\":\"Salt and pepper\",\"quantity\":1,\"unit\":\"pinch\"}]},{\"group\":\"White Rice\",\"items\":[{\"name\":\"Long-grain white rice\",\"quantity\":150,\"unit\":\"g\"},{\"name\":\"Water\",\"quantity\":280,\"unit\":\"ml\"},{\"name\":\"Salt\",\"quantity\":0.5,\"unit\":\"tsp\"},{\"name\":\"Neutral oil\",\"quantity\":1,\"unit\":\"tsp\"}]},{\"group\":\"Aj\u00ed Verde\",\"items\":[{\"name\":\"Large bunch of fresh coriander, leaves and stems\",\"quantity\":1,\"unit\":\"\"},{\"name\":\"Spring onions, roughly chopped\",\"quantity\":3,\"unit\":\"\"},{\"name\":\"Green chilli (jalape\u00f1o or serrano), roughly chopped\",\"quantity\":1,\"unit\":\"\"},{\"name\":\"Garlic clove\",\"quantity\":1,\"unit\":\"\"},{\"name\":\"Lime juice\",\"quantity\":2,\"unit\":\"tbsp\"},{\"name\":\"Olive oil\",\"quantity\":3,\"unit\":\"tbsp\"},{\"name\":\"Salt\",\"quantity\":0.5,\"unit\":\"tsp\"}]},{\"group\":\"To Serve\",\"items\":[{\"name\":\"Eggs\",\"quantity\":2,\"unit\":\"\"},{\"name\":\"Ripe avocado, sliced\",\"quantity\":1,\"unit\":\"\"},{\"name\":\"Butter, for frying eggs\",\"quantity\":10,\"unit\":\"g\"}]}],\"substitutes\":[{\"ingredient\":\"Pork belly strips\",\"alternatives\":[\"Thick-cut streaky bacon\",\"Pork ribs\"]},{\"ingredient\":\"Tinned black beans\",\"alternatives\":[\"Tinned kidney beans\",\"Tinned pinto beans\"]},{\"ingredient\":\"Green chilli\",\"alternatives\":[\"Half a green pepper for milder heat\",\"Pickled jalape\u00f1o\"]}],\"instructions\":[\"Prepare the chicharr\u00f3n: pat the pork belly strips completely dry. Score the skin lightly, then rub the skin side with bicarbonate of soda. Season all over with salt and cumin. Place skin-side down in a cold, dry heavy frying pan and set over a medium heat \u2014 starting cold helps render the fat. Cook for 12\u201315 minutes, pressing down occasionally, until the skin is deeply golden and crackling. Flip and cook the flesh side for 4\u20135 more minutes. Rest on a wire rack.\",\"While the pork renders, cook the rice: heat the oil in a small saucepan over medium heat, add the rice and stir for 1 minute until the grains look opaque. Add water and salt, bring to the boil, then cover tightly, reduce to the lowest heat and cook for 12 minutes. Remove from heat and leave covered for 5 minutes, then fluff with a fork.\",\"Make the black beans: heat olive oil in a small saucepan over medium heat. Saut\u00e9 the onion for 5 minutes until softened, then add garlic, cumin and smoked paprika and cook for 1 minute. Add the drained black beans and stock. Simmer for 8\u201310 minutes, stirring and lightly mashing some beans against the side of the pan to create a slightly creamy texture. Season well.\",\"Make the aj\u00ed verde: blitz the coriander, spring onions, chilli, garlic, lime juice, olive oil and salt in a small blender or use a stick blender. Blitz until smooth and bright green \u2014 taste and adjust lime and salt. It should be punchy, herby and fresh.\",\"Fry the eggs in butter over a medium heat until the whites are just set but the yolks are still runny. Season with salt and pepper.\",\"To plate: arrange a mound of rice and a generous spoonful of black beans side by side on each plate. Lean the chicharr\u00f3n strips against the rice, nestle the fried egg alongside, and fan out the avocado slices. Spoon or drizzle the aj\u00ed verde generously over everything and serve the rest alongside.\"],\"rating\":0,\"favourite\":false,\"createdAt\":1778161141830,\"emoji\":\"\ud83c\udf73\",\"image\":\"https://images.pexels.com/photos/34130182/pexels-photo-34130182.jpeg?auto=compress&cs=tinysrgb&dpr=2&h=650&w=940\"},{\"id\":\"mouj6f4bsoek\",\"sugId\":\"sug2\",\"title\":\"Szechuan-Style Dan Dan Noodles with Minced Pork & Crispy Chilli Oil\",\"category\":\"Pork\",\"desc\":\"One of Sichuan's most iconic street foods \u2014 springy wheat noodles coated in a deeply savoury, nutty, and mouth-tinglingly spicy sauce made from tahini, soy, black vinegar, and chilli oil, topped with a sticky five-spice pork mince. The contrast of textures and that characteristic ma la (numbing-hot) sensation make this one of the most addictive bowls of noodles you can make at home. It comes together in under 40 minutes and tastes like pure fire.\",\"time\":\"35 mins\",\"serves\":\"4\",\"ingredientGroups\":[{\"group\":\"Pork Topping\",\"items\":[{\"name\":\"Minced pork (20% fat)\",\"quantity\":400,\"unit\":\"g\"},{\"name\":\"Vegetable oil\",\"quantity\":1,\"unit\":\"tbsp\"},{\"name\":\"Shaoxing rice wine\",\"quantity\":2,\"unit\":\"tbsp\"},{\"name\":\"Light soy sauce\",\"quantity\":1,\"unit\":\"tbsp\"},{\"name\":\"Five-spice powder\",\"quantity\":0.5,\"unit\":\"tsp\"},{\"name\":\"Dark soy sauce\",\"quantity\":1,\"unit\":\"tsp\"}]},{\"group\":\"Dan Dan Sauce\",\"items\":[{\"name\":\"Tahini (or Chinese sesame paste)\",\"quantity\":4,\"unit\":\"tbsp\"},{\"name\":\"Light soy sauce\",\"quantity\":3,\"unit\":\"tbsp\"},{\"name\":\"Chinese black vinegar (Chinkiang)\",\"quantity\":2,\"unit\":\"tbsp\"},{\"name\":\"Chilli oil (with sediment)\",\"quantity\":3,\"unit\":\"tbsp\"},{\"name\":\"Toasted sesame oil\",\"quantity\":1,\"unit\":\"tbsp\"},{\"name\":\"Garlic cloves, finely grated\",\"quantity\":3,\"unit\":\"\"},{\"name\":\"Fresh ginger, finely grated\",\"quantity\":1,\"unit\":\"tsp\"},{\"name\":\"Caster sugar\",\"quantity\":1,\"unit\":\"tsp\"},{\"name\":\"Hot noodle cooking water\",\"quantity\":80,\"unit\":\"ml\"}]},{\"group\":\"Noodles & Garnish\",\"items\":[{\"name\":\"Fresh wheat noodles (or dried medium egg noodles)\",\"quantity\":400,\"unit\":\"g\"},{\"name\":\"Pak choi or baby spinach\",\"quantity\":200,\"unit\":\"g\"},{\"name\":\"Spring onions, finely sliced\",\"quantity\":4,\"unit\":\"\"},{\"name\":\"Roasted peanuts, roughly crushed\",\"quantity\":60,\"unit\":\"g\"},{\"name\":\"Sichuan peppercorns, toasted and ground\",\"quantity\":0.5,\"unit\":\"tsp\"}]}],\"substitutes\":[{\"ingredient\":\"Minced pork\",\"alternatives\":[\"Minced chicken\",\"Crumbled firm tofu for vegetarian\"]},{\"ingredient\":\"Chinese black vinegar\",\"alternatives\":[\"Rice wine vinegar with a pinch of sugar\",\"Balsamic vinegar (use half the amount)\"]},{\"ingredient\":\"Fresh wheat noodles\",\"alternatives\":[\"Dried spaghetti\",\"Ramen noodles\"]},{\"ingredient\":\"Sichuan peppercorns\",\"alternatives\":[\"A small pinch of white pepper \u2014 flavour differs but works\",\"Omit if unavailable\"]}],\"instructions\":[\"Start the pork: heat vegetable oil in a wok or heavy frying pan over a high heat. Add the minced pork and press it into the pan \u2014 don't stir immediately. Let it sit for 2\u20133 minutes until it develops a deep brown crust, then break it up. Add the Shaoxing wine and let it sizzle away, then add both soy sauces and the five-spice. Stir-fry for another 3\u20134 minutes until the pork is caramelised, sticky, and fragrant. Set aside.\",\"Make the sauce: in a bowl or jug, whisk together the tahini, light soy sauce, black vinegar, chilli oil, sesame oil, grated garlic, ginger, and sugar until smooth. It will look thick \u2014 that's correct. Set aside and don't add the cooking water yet.\",\"Cook the noodles according to packet instructions in a large pot of boiling water. In the last minute, add the pak choi or spinach to wilt. Reserve 80ml of the starchy cooking water before draining. Drain the noodles and greens well.\",\"Loosen the sauce with the hot noodle cooking water, whisking until it becomes a pourable, silky consistency. Divide the sauce between four bowls, then add the noodles and greens on top.\",\"Spoon the caramelised pork mince over the noodles, then scatter with spring onions, crushed peanuts, and a pinch of ground Sichuan peppercorn. Add an extra drizzle of chilli oil if you like heat. Toss everything together at the table before eating.\"],\"rating\":0,\"favourite\":false,\"createdAt\":1778100583691,\"emoji\":\"\ud83c\udf5c\",\"image\":\"https://images.unsplash.com/photo-1777476588739-a5285445a0c5?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3w5MjYwODl8MHwxfHNlYXJjaHwxfHxTemVjaHVhbi1TdHlsZSUyMERhbiUyMERhbiUyME5vb2RsZXMlMjB3aXRoJTIwTWluY2VkJTIwUG9yayUyMCUyNiUyMENyaXNweSUyMENoaWxsaSUyME9pbCUyMGZvb2QlMjBkaXNofGVufDB8MHx8fDE3NzgwNDQyNjh8MA&ixlib=rb-4.1.0&q=80&w=1080\",\"ingredients\":[],\"calories\":null,\"protein\":null,\"fibre\":null,\"healthScore\":null},{\"id\":\"mot903q4c0pj\",\"sugId\":\"sug3\",\"title\":\"Ethiopian Doro Wat \u2014 Spiced Braised Chicken in Berbere Butter Sauce with Injera\",\"category\":\"Chicken\",\"desc\":\"Doro Wat is Ethiopia's most celebrated dish \u2014 chicken braised low and slow in a gloriously deep, brick-red berbere and niter kibbeh sauce that is simultaneously spicy, aromatic, and impossibly rich. Hard-boiled eggs are a traditional and essential addition, absorbing the sauce as they sit, and the whole thing served over spongy injera (or flatbread) makes for a meal that is completely unlike anything else.\",\"time\":\"1 hr 15 mins\",\"serves\":\"4\",\"ingredientGroups\":[{\"group\":\"Chicken & Eggs\",\"items\":[{\"name\":\"Bone-in chicken thighs and drumsticks, skin removed\",\"quantity\":1.2,\"unit\":\"kg\"},{\"name\":\"Eggs\",\"quantity\":4,\"unit\":\"\"},{\"name\":\"Lemon juice\",\"quantity\":2,\"unit\":\"tbsp\"},{\"name\":\"Salt\",\"quantity\":1,\"unit\":\"tsp\"}]},{\"group\":\"Sauce Base\",\"items\":[{\"name\":\"Red onions, very finely diced\",\"quantity\":4,\"unit\":\"large\"},{\"name\":\"Unsalted butter\",\"quantity\":80,\"unit\":\"g\"},{\"name\":\"Berbere spice blend\",\"quantity\":3,\"unit\":\"tbsp\"},{\"name\":\"Garlic cloves, minced\",\"quantity\":5,\"unit\":\"\"},{\"name\":\"Fresh ginger, finely grated\",\"quantity\":25,\"unit\":\"g\"},{\"name\":\"Tomato pur\u00e9e\",\"quantity\":2,\"unit\":\"tbsp\"},{\"name\":\"Chicken stock or water\",\"quantity\":250,\"unit\":\"ml\"},{\"name\":\"Dry red wine or tej (Ethiopian honey wine)\",\"quantity\":100,\"unit\":\"ml\"},{\"name\":\"Cardamom pods, lightly crushed\",\"quantity\":3,\"unit\":\"\"},{\"name\":\"Salt and black pepper\",\"quantity\":0,\"unit\":\"to taste\"}]},{\"group\":\"To Serve\",\"items\":[{\"name\":\"Injera (store-bought) or warmed flatbreads\",\"quantity\":4,\"unit\":\"\"},{\"name\":\"Fresh coriander or flat-leaf parsley\",\"quantity\":1,\"unit\":\"small handful\"}]}],\"substitutes\":[{\"ingredient\":\"Berbere spice blend\",\"alternatives\":[\"Mix of 1 tbsp each smoked paprika and chilli flakes, plus \u00bd tsp each of cinnamon, fenugreek, coriander, and allspice\"]},{\"ingredient\":\"Bone-in chicken thighs\",\"alternatives\":[\"Whole chicken legs\",\"Chicken drumsticks only\"]},{\"ingredient\":\"Dry red wine\",\"alternatives\":[\"Extra stock plus a splash of red wine vinegar\",\"Pomegranate juice\"]},{\"ingredient\":\"Injera\",\"alternatives\":[\"Warmed flatbreads\",\"Toasted sourdough\",\"Steamed basmati rice\"]}],\"instructions\":[\"Step 1 \u2014 Score the chicken pieces a few times to the bone with a sharp knife \u2014 this helps the sauce penetrate deeply. Rub all over with lemon juice and salt and set aside for 15 minutes. Meanwhile, hard-boil the eggs for 9 minutes, cool in cold water, peel, and pierce each one all over with a fork or skewer. This allows the sauce to absorb into the eggs as they cook \u2014 don't skip this.\",\"Step 2 \u2014 The most critical step: dry-cook the diced red onions in a large, heavy-bottomed pot or Dutch oven over medium-low heat with no oil or butter for 15\u201320 minutes, stirring frequently. The onions will soften dramatically and release their moisture, eventually becoming a deep, jammy, almost dry mass. This is the foundation of the sauce and cannot be rushed.\",\"Step 3 \u2014 Add the butter to the onions and let it melt into them. Then add the berbere spice blend and stir continuously for 2\u20133 minutes until the spices are toasted in the butter and the kitchen smells incredible. Add the minced garlic, grated ginger, and crushed cardamom pods and cook for another 2 minutes.\",\"Step 4 \u2014 Stir in the tomato pur\u00e9e and cook for 1 minute. Pour in the red wine and let it bubble and reduce by half, about 2 minutes. Add the stock, stir well, and bring to a simmer.\",\"Step 5 \u2014 Add the chicken pieces, turning to coat in the sauce. Nestle them in so they are mostly submerged. Cover with a lid, reduce heat to low, and braise for 30 minutes, turning the chicken once halfway through.\",\"Step 6 \u2014 Remove the lid. Add the peeled, pricked hard-boiled eggs to the sauce, pushing them in gently. Continue cooking uncovered for a further 15 minutes until the sauce has thickened to a rich, coating consistency and the chicken is completely tender and falling off the bone. Taste and season generously.\",\"Step 7 \u2014 To serve, lay injera or flatbreads on large plates or a communal platter. Spoon the chicken and eggs over the bread, ladling the sauce generously over everything \u2014 the bread should soak it up. Scatter with fresh coriander and serve immediately. Doro Wat is traditionally eaten communally, scooping with torn pieces of injera.\"],\"rating\":5,\"favourite\":true,\"createdAt\":1778023026652,\"emoji\":\"\ud83c\udf57\",\"image\":\"https://images.pexels.com/photos/35156472/pexels-photo-35156472.jpeg?auto=compress&cs=tinysrgb&dpr=2&h=650&w=940\",\"cooked\":true,\"lastCooked\":1778439754960}]");

eight\":\"86kg\",\"reps\":\"10\"},{\"id\":\"moycbdk557tz\",\"name\":\"Machine Chest Press\",\"sets\":3,\"weight\":\"52kg\",\"reps\":\"10\"},{\"id\":\"moycbtsvkxwf\",\"name\":\"Lateral Raises\",\"sets\":3,\"weight\":\"7.5kg\",\"reps\":\"10\"}],\"cardio\":[],\"activities\":[],\"notes\":\"\"},{\"id\":\"mozpd6pi8y26\",\"date\":\"2026-05-10\",\"exercises\":[{\"id\":\"mozpam5a7q9q\",\"name\":\"Arm Curls\",\"sets\":3,\"weight\":\"28kg\",\"reps\":\"10\"},{\"id\":\"mozparrhv1w1\",\"name\":\"Standing Bicep Curls\",\"sets\":3,\"weight\":\"16kg\",\"reps\":\"12\"},{\"id\":\"mozpazxunvk6\",\"name\":\"EZ Bar Curls\",\"sets\":3,\"weight\":\"30kg\",\"reps\":\"6\"},{\"id\":\"mozpb60bjbwg\",\"name\":\"Bayesian Curls\",\"sets\":2,\"weight\":\"12kg\",\"reps\":\"8\"},{\"id\":\"mozpbe4w66mz\",\"name\":\"Pull Ups\",\"sets\":3,\"weight\":\"\",\"reps\":\"11\"},{\"id\":\"mozpbw8qi1ve\",\"name\":\"Lat Pullovers\",\"sets\":3,\"weight\":\"28kg\",\"reps\":\"8\"},{\"id\":\"mozpc4423ou3\",\"name\":\"Facepulls\",\"sets\":3,\"weight\":\"28kg\",\"reps\":\"8\"},{\"id\":\"mozpccthcy1v\",\"name\":\"Cable Rows\",\"sets\":3,\"weight\":\"70.6kg\",\"reps\":\"8\"},{\"id\":\"mozpcve0ex76\",\"name\":\"Lat Pulldowns\",\"sets\":3,\"weight\":\"59kg\",\"reps\":\"8\"}],\"cardio\":[],\"activities\":[],\"notes\":\"\"}]");

  ls("ph_curiosity_favs_v1", "[{\"id\":\"1778023032320\",\"type\":\"full\",\"title\":\"The Silk Road of the Sea: How the Monsoon Winds Built the Indian Ocean World\",\"contentDate\":\"2026-05-05\",\"savedAt\":\"2026-05-05T23:17:12.320Z\",\"fullData\":{\"article\":{\"title\":\"The Silk Road of the Sea: How the Monsoon Winds Built the Indian Ocean World\",\"subtitle\":\"Long before European ships rounded Africa, Arab, Indian, and Chinese merchants had mastered the greatest trading system the ancient world ever knew.\",\"image\":\"https://upload.wikimedia.org/wikipedia/commons/d/d3/Indian_Ocean-CIA_WFB_Map.png\",\"content\":[{\"type\":\"paragraph\",\"text\":\"Sometime around the first century BCE, a Greek sailor named Hippalus \u2014 or so the story goes \u2014 'discovered' that the Indian Ocean breathed. Every summer the winds blew steadily northeast toward India; every winter they reversed and carried ships home. In reality, Arab and Indian navigators had known this for centuries, and the monsoon system had already been sustaining one of history's most complex and lucrative trading networks. What Hippalus may have done was simply convince Mediterranean merchants that the route was safe enough for Roman gold.\"},{\"type\":\"heading\",\"text\":\"A Highway Made of Wind\"},{\"type\":\"paragraph\",\"text\":\"The Indian Ocean is the only ocean on Earth whose surface winds reverse direction seasonally, driven by the differential heating of land and sea across Asia and Africa. This predictable rhythm transformed what might have been a terrifying expanse of open water into something navigators could plan around with almost calendar precision. Sailors loaded their dhows and junks knowing that nature itself would deliver them to their destination and then, six months later, bring them home again. The monsoon did not merely assist trade \u2014 it made civilisation on this scale possible.\"},{\"type\":\"heading\",\"text\":\"The Ports at the End of the World\"},{\"type\":\"paragraph\",\"text\":\"At the height of the Roman Empire, the emporium of Muzris on India's Malabar Coast received Roman merchant vessels carrying vast quantities of gold coin, wine, and glassware. In exchange, Rome's wealthy elite consumed pepper, cardamom, ivory, and Chinese silk at prices that horrified moralists. The Elder Pliny complained that India drained fifty million sesterces from the Roman treasury every year \u2014 a figure that, even if exaggerated, points to a trade deficit that shaped imperial monetary policy. Archaeology has since confirmed the scale: Roman coins and amphorae turn up in excavations from southern India to Vietnam.\"},{\"type\":\"heading\",\"text\":\"The Middlemen Who Shaped History\"},{\"type\":\"paragraph\",\"text\":\"The greatest beneficiaries of the system were rarely its endpoints but its intermediaries. Arab merchants sailing from Oman and Yemen, Indian Gujarati traders, Jewish and later Muslim Swahili merchants on the East African coast \u2014 these were the people who understood every leg of the network and extracted value at each transfer point. The city of Calicut on the Malabar Coast became so synonymous with Indian textiles that we still name a fabric after it: calico. Hormuz, at the mouth of the Persian Gulf, grew so wealthy that a Portuguese chronicler wrote that if the world were a ring, Hormuz would be its jewel.\"},{\"type\":\"heading\",\"text\":\"What Actually Travelled\"},{\"type\":\"paragraph\",\"text\":\"Spices and silk get all the glory, but the Indian Ocean trade moved something far more consequential: ideas, religions, and people. Buddhism travelled from India to Southeast Asia along merchant shipping lanes, not overland missionary paths. Islam reached the Indonesian archipelago centuries before any conquering army, carried by Muslim traders whose piety and commercial networks were inseparable. The Swahili language itself is a monument to this mixing \u2014 a Bantu grammar carrying hundreds of Arabic loanwords, the linguistic residue of a thousand years of coastal commerce.\"},{\"type\":\"heading\",\"text\":\"The Disruption of 1498\"},{\"type\":\"paragraph\",\"text\":\"When Vasco da Gama rounded the Cape of Good Hope and arrived at Calicut in 1498, he was not discovering an unknown world \u2014 he was gate-crashing a thriving one. The Arab pilot Ahmed ibn Majid guided his fleet across the final stretch, proof that the Indian Ocean network had navigational knowledge Europeans could only borrow. What Portugal brought was not superior seamanship but superior firepower, and within decades the Estado da India was extorting tolls from merchants who had sailed freely for centuries. The violence was shocking precisely because the existing system had been, by the standards of the age, remarkably open.\"},{\"type\":\"heading\",\"text\":\"The World the Monsoon Made\"},{\"type\":\"paragraph\",\"text\":\"The Indian Ocean world produced artistic and architectural forms that defy simple national attribution. The mosque styles of coastal East Africa blend Arab pointed arches with local coral stone and mangrove timber in ways that belong to no single culture. The cuisine of Malaysia fuses Chinese technique, Indian spice, and Malay ingredient into something entirely its own. Even the crops moved: Southeast Asian sugarcane and citrus reached the Mediterranean via Arab traders; American chillies, arriving after 1500, were so rapidly absorbed into Indian and Thai cooking that it is now almost impossible to imagine those cuisines without them.\"},{\"type\":\"heading\",\"text\":\"Why This Story Was Forgotten \u2014 and Why It Matters\"},{\"type\":\"paragraph\",\"text\":\"For much of the nineteenth and twentieth centuries, Western historiography framed the story of global trade as beginning with European expansion. The Indian Ocean world was treated as a collection of passive markets waiting to be connected by Portuguese caravels and Dutch East Indiamen. Historians like K.N. Chaudhuri and, later, Michael Pearson and Janet Abu-Lughod spent careers dismantling this myth, demonstrating that a genuinely globalised economy existed centuries before Vasco da Gama set sail. Their work reshaped how we understand not just trade history but the very definition of modernity. The monsoon, it turns out, was the first engine of globalisation \u2014 and it ran entirely without European hands on the wheel.\"}]},\"person\":{\"name\":\"Ahmad ibn Majid\",\"lifespan\":\"c. 1432\u2013c. 1500\",\"category\":\"Exploration & Navigation\",\"bio\":\"Ahmad ibn Majid was born around 1432 in Julfar, in what is now the United Arab Emirates, into a family of master navigators. His father and grandfather were both celebrated pilots of the Indian Ocean, and Ibn Majid absorbed their accumulated knowledge of stars, currents, and monsoon patterns from childhood. He would go on to become the greatest Arab navigator of the medieval period, earning the honorary title 'Lion of the Sea' and composing works on navigation that were without parallel in any language of his age.\\n\\nIbn Majid wrote more than forty navigational texts, including his masterwork the Kitab al-Fawa'id ('Book of Useful Information on the Principles and Rules of Navigation'), completed around 1490. These were not merely practical sailing manuals \u2014 they were sophisticated astronomical and geographical treatises that described the star paths, seasonal winds, and coastal landmarks of the entire Indian Ocean basin, from East Africa to China. He invented a system of measuring stellar altitude using a device called a kamal, a simple but brilliant tool that allowed sailors to fix their latitude with remarkable accuracy. His writings preserved centuries of accumulated Arab navigational wisdom in a single, coherent body of knowledge.\\n\\nIbn Majid is most famous in the West for a claim that troubles historians: that he was the pilot who guided Vasco da Gama from Malindi on the East African coast to Calicut in 1498. The evidence is ambiguous \u2014 some Arabic sources name him, but he himself never mentions the encounter in his surviving writings, and some scholars believe a different pilot was involved. Whether or not he personally assisted the Portuguese, the episode encapsulates the paradox of his legacy: the man who perhaps did most to hand the Indian Ocean to European powers was himself the supreme embodiment of the independent navigational tradition those powers would soon suppress. He died sometime around 1500, on the cusp of the transformation he may have helped set in motion.\",\"image\":\"https://images.unsplash.com/photo-1656759685195-8b035b7f30d9?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3w5MjYwODl8MHwxfHNlYXJjaHwxfHxBaG1hZCUyMGlibiUyME1hamlkJTIwcG9ydHJhaXR8ZW58MHwyfHx8MTc3Nzk2NTA3Nnww&ixlib=rb-4.1.0&q=80&w=1080&crop=faces,entropy&fit=crop\"},\"onthisday\":{\"date\":\"May 5, 1821\",\"headline\":\"Napoleon Bonaparte Dies in Exile on Saint Helena\",\"summary\":\"On May 5, 1821, Napoleon Bonaparte died on the remote South Atlantic island of Saint Helena, six years after his final defeat at Waterloo. He was fifty-one years old, and his death \u2014 officially attributed to stomach cancer, though theories of arsenic poisoning have circulated ever since \u2014 ended one of the most extraordinary careers in the history of warfare and statecraft. The man who had once commanded an empire stretching from Portugal to the borders of Russia died in a damp, wind-battered house called Longwood, attended by a small circle of loyal followers and closely watched by his British captors.\\n\\nHis last years on the island were marked by a deliberate campaign of self-mythologising. Confined and humiliated, Napoleon spent long hours dictating his memoirs, carefully recasting his wars as defensive struggles for European liberty against reactionary monarchies and reframing his legal and administrative reforms \u2014 the Napoleonic Code, the reorganisation of the French state \u2014 as his true legacy. It was a brilliant piece of posthumous propaganda. By the time his remains were returned to Paris in 1840, to be interred beneath the golden dome of Les Invalides, France had transformed him from a defeated tyrant into a romantic hero. The Napoleonic legend, more than the man himself, would haunt European politics for the rest of the nineteenth century.\",\"image\":\"https://upload.wikimedia.org/wikipedia/commons/thumb/0/00/Flag_of_Saint_Helena.svg/1280px-Flag_of_Saint_Helena.svg.png\"}}},{\"id\":\"1778365925602\",\"type\":\"full\",\"title\":\"The Sweat Sickness: The Mysterious Plague That Terrified Tudor England and Then Vanished Forever\",\"contentDate\":\"2026-05-09\",\"savedAt\":\"2026-05-09T22:32:05.602Z\",\"fullData\":{\"article\":{\"title\":\"The Sweat Sickness: The Mysterious Plague That Terrified Tudor England and Then Vanished Forever\",\"subtitle\":\"Five times it erupted, killed without warning, and disappeared. Then, after 1551, it never came back \u2014 and nobody has ever explained why.\",\"image\":\"https://images.unsplash.com/photo-1778082628895-368d7b06b413?crop=entropy&cs=tinysrgb&fit=max&fm=jpg&ixid=M3w5MjYwODl8MHwxfHNlYXJjaHwxfHxFbmdsaXNoJTIwU3dlYXRpbmclMjBTaWNrbmVzcyUyMFR1ZG9yJTIwZXBpZGVtaWN8ZW58MHwwfHx8MTc3ODMwMzI5M3ww&ixlib=rb-4.1.0&q=80&w=1080\",\"content\":[{\"type\":\"paragraph\",\"text\":\"In the summer of 1485, a new and terrifying disease arrived in England along with Henry Tudor's invading army. Within days of the Battle of Bosworth Field, it had spread from the soldiers to the streets of London. It killed so fast that contemporaries said a man could be 'merry at dinner and dead at supper.' No one had seen anything like it before, and for the next sixty-six years, it would haunt the kingdom like a recurring nightmare.\"},{\"type\":\"paragraph\",\"text\":\"The disease became known as the sweating sickness \u2014 sudor anglicus in Latin \u2014 and it was unlike the plague, unlike typhus, unlike anything the physicians of the age had in their textbooks. It struck with violent suddenness, producing drenching sweats, a thunderous heartbeat, and an overwhelming compulsion to sleep that, if yielded to, was almost always fatal. Most victims were dead within twenty-four hours of showing their first symptom. Those who survived the first day usually recovered completely.\"},{\"type\":\"heading\",\"text\":\"A Disease That Chose Its Victims Carefully\"},{\"type\":\"paragraph\",\"text\":\"What made the sweating sickness especially strange \u2014 and especially frightening to Tudor society \u2014 was who it killed. Unlike the plague, which cut indiscriminately through the poor and overcrowded, the sweat seemed to prefer the prosperous. Young, healthy men in the prime of life were its most frequent victims; the old, the very young, and the poor seemed comparatively protected. This was deeply unsettling to a society that interpreted disease as divine punishment, since the wealthy were being struck down while the wretched survived.\"},{\"type\":\"paragraph\",\"text\":\"The disease also showed a striking preference for the English. When it crossed the Channel in 1528 and swept through continental Europe, it killed English residents of Antwerp and Paris while leaving their French and Flemish neighbours largely untouched. This pattern was so pronounced that foreign observers remarked on it with a mixture of pity and grim satisfaction. Holy Roman Emperor Charles V dismissed his English attendants from court during the 1528 outbreak, not wanting to catch whatever peculiarly English curse had descended upon them.\"},{\"type\":\"heading\",\"text\":\"Five Outbreaks, Five Panics\"},{\"type\":\"paragraph\",\"text\":\"The sweating sickness struck England five times: in 1485, 1508, 1517, 1528, and 1551. Each outbreak arrived without warning and vanished just as abruptly, usually within a few weeks to a few months. The 1528 epidemic was the worst and widest, reaching Hamburg, Vienna, and Scandinavia. The 1551 outbreak, though confined to England, was notable for the meticulous account left by the physician John Caius, who produced the first serious clinical description of the disease in his book 'A Boke or Counseill Against the Disease Commonly Called the Sweate or Sweatyng Sicknesse.'\"},{\"type\":\"paragraph\",\"text\":\"Cardinal Wolsey, the most powerful man in England after Henry VIII, caught the sweat in 1517 and survived \u2014 barely. Anne Boleyn contracted it in 1528 while Henry was desperately writing her love letters and arranging the best physicians he could find. She survived too, though several of her household did not. Henry VIII himself lived in terror of the sweating sickness throughout his life and would flee London at the first rumour of its approach, abandoning court, councils, and everything else in his headlong panic.\"},{\"type\":\"heading\",\"text\":\"What the Doctors Said \u2014 and Got Wrong\"},{\"type\":\"paragraph\",\"text\":\"Tudor medicine was still operating largely within the Galenic framework of humours and miasmas, and its practitioners were predictably baffled. The standard treatment was to keep the patient warm, bundle them in blankets, and \u2014 critically \u2014 not allow them to sleep. Attendants would walk patients up and down for hours, pinching and slapping them to keep their eyes open, since sleep in the first twenty-four hours was observed to be fatal. Whether this actually helped or merely tortured the dying is impossible to say, but it was the one piece of advice that seems to have had some empirical basis, however misunderstood.\"},{\"type\":\"paragraph\",\"text\":\"John Caius, whose 1552 account remains the most valuable primary source, was a Cambridge-trained physician who had studied at Padua under the anatomist Vesalius. He blamed the disease on 'evil vapours' and the damp English climate, but his symptom descriptions are precise enough to be medically useful today. He noted the rapid onset, the profuse sweating, the cardiac symptoms, the peculiar lethality of the first hours, and the tendency of survivors to recover completely without lasting damage. His account is a remarkable piece of Renaissance medical writing \u2014 careful, observational, and tantalisingly incomplete.\"},{\"type\":\"heading\",\"text\":\"The Great Unsolved Mystery\"},{\"type\":\"paragraph\",\"text\":\"After the 1551 epidemic, the sweating sickness disappeared entirely from the historical record. It did not fade gradually, it did not become endemic at low levels, and it did not transform into something else recognisable. It simply stopped. No subsequent outbreak has ever been convincingly identified anywhere in the world. This complete disappearance is, if anything, more puzzling than the disease itself \u2014 most infectious diseases either persist, evolve, or leave traceable descendants, but the sweating sickness left nothing.\"},{\"type\":\"paragraph\",\"text\":\"Historians and epidemiologists have proposed dozens of candidate pathogens over the centuries. Anthrax was suggested early on, then dismissed. Typhus has its advocates, though the symptom profile fits poorly. Relapsing fever has been proposed. In the late twentieth century, attention shifted to hantaviruses \u2014 rodent-borne viruses that cause haemorrhagic fevers with pulmonary symptoms \u2014 and the theory has attracted serious support. The 1993 outbreak of hantavirus pulmonary syndrome in the American Southwest produced a disease with some striking similarities to Tudor accounts, including rapid onset, severe respiratory distress, and high mortality in otherwise healthy adults.\"},{\"type\":\"paragraph\",\"text\":\"A related theory, advanced by a team of French researchers in 2012, points specifically to a hantavirus carried by a species of field mouse. The researchers noted that the disease's English predilection and rural summer seasonality fit the ecological patterns of rodent-borne transmission, and that the collapse of a particular mouse population \u2014 perhaps through a change in climate or agriculture \u2014 could explain the disease's sudden disappearance after 1551. It remains a hypothesis, not a verdict, but it is currently the most scientifically credible candidate.\"},{\"type\":\"heading\",\"text\":\"Why It Still Matters\"},{\"type\":\"paragraph\",\"text\":\"The sweating sickness matters not just as a curiosity but as a case study in how completely a lethal disease can vanish before the age of microbiology \u2014 leaving nothing behind but frightened descriptions in old books. Modern medicine has identified the mechanisms of hundreds of historical plagues, from Justinian's to the Black Death, through DNA analysis of skeletal remains and preserved tissue. But the sweating sickness has so far resisted every attempt to pin it down, because we have never found confirmed remains from a victim whose death can be attributed to it with certainty.\"},{\"type\":\"paragraph\",\"text\":\"There is also something quietly sobering in its story for the present age. A disease arrived, killed thousands, terrified a continent, and departed \u2014 all within living memory of the people who experienced it, all without leaving us enough evidence to know what it truly was. The sweating sickness is a reminder that history contains silences as well as records, and that the natural world is capable of mounting threats that come and go on their own terms, indifferent to our attempts to classify or contain them.\"},{\"type\":\"paragraph\",\"text\":\"Henry VIII's England survived five visitations of something that could kill a cardinal by nightfall. The kingdom mourned, panicked, prayed, and eventually moved on \u2014 as societies always do. But the sweating sickness never granted its victims the dignity of an explanation. It remains, more than four centuries after its last appearance, the most mysterious epidemic in English history: a ghost disease that once killed kings' companions and now refuses even to tell us its name.\"}]},\"person\":{\"name\":\"John Caius\",\"lifespan\":\"1510\u20131573\",\"category\":\"Medicine & Scholarship\",\"bio\":\"John Caius was an English physician and scholar whose combination of Renaissance humanism and rigorous clinical observation made him one of the most important medical figures of sixteenth-century Europe. Born in Norwich in 1510, he studied at Gonville Hall, Cambridge, before travelling to Padua \u2014 then the greatest medical school in the world \u2014 where he shared lodgings with Andreas Vesalius, the revolutionary anatomist who was in the process of overturning a thousand years of received wisdom about the human body. The experience left a permanent mark on Caius: he returned to England with a deep commitment to direct observation over inherited authority, a radical position in an age still dominated by Galenic tradition.\\n\\nBack in England, Caius built a formidable reputation as a physician and was appointed personal doctor to three successive monarchs \u2014 Edward VI, Mary I, and Elizabeth I \u2014 a remarkable feat of political survival in an age when backing the wrong sovereign could be fatal. He was admitted to the College of Physicians in 1547 and served as its president nine times, using the position to push for higher standards and to campaign against unlicensed medical practice. He lectured on anatomy and was among the first in England to conduct systematic human dissections, securing an annual grant of executed criminals' bodies from the crown for this purpose.\\n\\nCaius is perhaps best remembered today for two things: his detailed account of the sweating sickness, published in 1552, and his refounding of his old Cambridge college. His 'A Boke or Counseill Against the Disease Commonly Called the Sweate' is the most important primary source on the Tudor epidemic, combining careful symptom descriptions with practical advice for patients and physicians. In 1557, he re-endowed Gonville Hall with his own considerable fortune, expanding it and renaming it Gonville and Caius College \u2014 the institution that still bears his name and where he served as Master for several years. He controversially required his college to accept no students who were deformed, disabled, or Welsh, prejudices that sit uncomfortably alongside his undoubted intellectual achievements.\\n\\nIn his final years, Caius became embroiled in fierce disputes with the younger Protestant fellows of his own college, who resented both his conservative Catholicism and his autocratic governance. They eventually ransacked his rooms and burned his collection of vestments and Catholic objects \u2014 a humiliating end for a man who had shaped English medicine for a generation. He died in 1573 and was buried in the college chapel at Cambridge, in the institution he had rebuilt and that had ultimately rejected him. His legacy is the tension at the heart of Renaissance learning: brilliant, meticulous, generous, and also deeply limited by the prejudices of his age.\",\"image\":\"https://upload.wikimedia.org/wikipedia/commons/5/59/John_Caius_G%26C.jpg\"},\"onthisday\":{\"date\":\"May 9, 1950\",\"headline\":\"The First Ascent of Annapurna: Mankind Reaches 8,000 Metres\",\"summary\":\"On this day in 1950, French mountaineers Maurice Herzog and Louis Lachenal became the first human beings in history to reach the summit of an eight-thousander \u2014 a peak above 8,000 metres. Annapurna I, standing at 8,091 metres in the Nepalese Himalayas, had only been identified as a potential climbing target weeks earlier when the French expedition, initially hoping to attempt Dhaulagiri, discovered that Annapurna was actually the more accessible goal. In a matter of days, with almost no detailed maps and in deteriorating weather, the team identified a viable route and launched their summit push.\\n\\nThe ascent was an extraordinary achievement shadowed by terrible cost. Herzog and Lachenal reached the top in the early afternoon, becoming heroes overnight and inspiring a generation of mountaineers. But the descent was catastrophic: caught in an avalanche, losing their gloves in the snow, and descending through a brutal storm, both men suffered severe frostbite. Herzog lost all his fingers and toes; Lachenal lost his toes. The expedition doctor performed repeated amputations in the field using basic equipment, and the injured men were carried down through the mountains on the backs of porters and teammates. Herzog's 1952 memoir, 'Annapurna,' became one of the best-selling mountaineering books ever written, though Lachenal's own account \u2014 more honest about the terror and the cost \u2014 was suppressed for decades and only published posthumously in edited form. Annapurna remains, statistically, the most dangerous of all the eight-thousanders, with a fatality-to-summit ratio that still dwarfs Everest.\",\"image\":\"https://upload.wikimedia.org/wikipedia/commons/0/0e/Spectrum514d.jpg\"}}}]");
  ls("ph_philosophy_favs_v1", "[{\"id\":\"1777923748310\",\"type\":\"full\",\"title\":\"The Calculus of Consent: Francisco de Vitoria and the Birth of International Law\",\"contentDate\":\"2026-05-04\",\"savedAt\":\"2026-05-04T19:42:28.310Z\",\"fullData\":{\"theory\":{\"title\":\"The Calculus of Consent: Francisco de Vitoria and the Birth of International Law\",\"subtitle\":\"Before nations had rights, one Spanish theologian asked whether conquest could ever be just \u2014 and his answer reshaped the world.\",\"image\":\"https://upload.wikimedia.org/wikipedia/commons/b/ba/Franciscodevictoria.jpg\",\"content\":[{\"type\":\"paragraph\",\"text\":\"In the year 1532, a Dominican friar named Francisco de Vitoria stood before students at the University of Salamanca and delivered a lecture that, by any measure, was either extraordinarily courageous or extraordinarily naive. The Spanish Empire was at the height of its power, its soldiers carving through the Americas with official blessing from the Pope and the Crown. Vitoria proceeded to argue, systematically and publicly, that the conquest might be unjust. He did not do this as a radical outsider, but as the most respected theologian in Spain, occupying the most prestigious chair in the country. His lectures, known as the Relectiones, were not pamphlets of protest \u2014 they were rigorous philosophical arguments that would quietly detonate beneath the foundations of empire.\"},{\"type\":\"heading\",\"text\":\"The Problem of the New World\"},{\"type\":\"paragraph\",\"text\":\"The philosophical crisis created by the encounter with the Americas was unlike anything European thought had previously confronted. The people of the Americas had no place in the Bible, no mention in Aristotle, and no relationship to existing canon law. The dominant justifications for Spanish conquest relied on two pillars: the papal donation, which held that the Pope had the authority to grant sovereignty over non-Christian lands, and the Aristotelian doctrine of natural slavery, which held that some peoples were by nature suited to be ruled rather than to rule. Vitoria subjected both arguments to methodical demolition. He argued that the Pope had no temporal jurisdiction over non-believers who had never acknowledged his authority, and that Aristotle's doctrine, even if philosophically coherent in the abstract, could not simply be applied to entire peoples without specific evidence of incapacity. The Indigenous peoples of the Americas, he insisted, were fully rational beings with legitimate political communities, genuine property rights, and the standing to resist unjust aggression.\"},{\"type\":\"heading\",\"text\":\"The Law of Nations and the Rights of All People\"},{\"type\":\"paragraph\",\"text\":\"What makes Vitoria philosophically groundbreaking is his reconstruction of the concept of ius gentium \u2014 the law of nations \u2014 as something that binds not merely Christian kingdoms, but all human communities everywhere. Drawing on the Stoic idea of a universal rational nature shared by all humans, and filtering it through Thomistic theology, Vitoria argued that there exists a body of natural law accessible to reason, discoverable by any rational being regardless of religion or culture. This law grants to all peoples certain inviolable rights: the right to govern themselves, the right to their own property, and the right not to be coerced into conversion. Crucially, he also argued that this same universal law creates obligations \u2014 including the obligation to permit peaceful travel, trade, and communication between peoples. From this emerged a recognizable forerunner of what we now call international law: a normative order that transcends any single sovereign authority.\"},{\"type\":\"heading\",\"text\":\"Just War and Its Strict Conditions\"},{\"type\":\"paragraph\",\"text\":\"Vitoria did not conclude that war was always impermissible \u2014 he was working within and refining the just war tradition inherited from Augustine and Aquinas. But he significantly tightened its conditions in ways that made the conquest deeply problematic. A just war, he argued, requires a genuine injury to have been inflicted, a legitimate authority to wage it, a right intention, and proportionality between the harm caused and the good achieved. Crucially, he introduced a symmetry argument that was philosophically radical: if both sides in a conflict have sincere, reasonable beliefs that they are in the right, then soldiers on both sides can act in good conscience \u2014 which also means that wars fought for nakedly imperial motives, dressed in the costume of justice, carry no moral weight at all. The refusal of the Indigenous peoples to accept Christianity was not, in itself, grounds for war. Vitoria wrote with the care of a man who knew his conclusions were dangerous.\"},{\"type\":\"heading\",\"text\":\"The Tension at the Heart of Vitoria\"},{\"type\":\"paragraph\",\"text\":\"There is a profound and uncomfortable tension in Vitoria's thought that historians and philosophers have wrestled with ever since. On one hand, he articulates protections for Indigenous peoples that are genuinely radical for his era \u2014 protections grounded in a universal human dignity that cuts across religious and cultural difference. On the other hand, he identifies a range of \\\"legitimate\\\" grounds for Spanish intervention that, in practice, provided ample cover for the very conquests he appeared to be limiting. If the Indigenous peoples refused to allow free trade or peaceful passage, that could constitute grounds for a just war. If they practiced human sacrifice \u2014 a charge the Spanish leveled constantly \u2014 that too might justify intervention to protect the innocent. Critics have argued that Vitoria effectively invented a more sophisticated ideological framework for empire, one that sounded humane while leaving the door to conquest ajar. Whether this represents a failure of his philosophy or an honest recognition of moral complexity remains genuinely contested.\"},{\"type\":\"heading\",\"text\":\"A Philosophy Built for a World Without Borders\"},{\"type\":\"paragraph\",\"text\":\"What is undeniable is that Vitoria's vision was architecturally innovative. He imagined the world not as a collection of isolated sovereign units, each answerable only to God or to force, but as a single moral community bound by shared rational nature and therefore by shared obligations. The Spanish Empire, in his framework, was not a uniquely privileged agent of divine will but a member of a community of nations \u2014 one that could be judged, criticized, and found wanting by the standards of universal reason. This idea \u2014 that a universal moral law exists above and beyond the will of any particular state \u2014 is the philosophical seed from which grew Hugo Grotius's systematic international law, Kant's perpetual peace, and eventually the architecture of the United Nations and international human rights law. Vitoria rarely gets the credit he deserves in popular accounts of these developments, perhaps because his theological idiom makes him feel distant. But the structural logic is unmistakably his.\"},{\"type\":\"paragraph\",\"text\":\"Francisco de Vitoria died in 1546, before the full brutality of the conquest had fully unfolded, before Las Casas had written his most devastating accounts, before the silver mines of Potos\u00ed had consumed hundreds of thousands of lives. He did not live to see what his careful arguments were unable to prevent. But philosophy rarely prevents atrocities in the short term \u2014 its power is generative and slow, working through the minds it shapes across generations. What Vitoria bequeathed to the world was a conceptual vocabulary in which all peoples, regardless of faith or origin, could be recognized as bearers of rights and subjects of justice. That vocabulary, however imperfectly it has been honored, is one of the more important things that philosophy has ever contributed to the practical organization of human life. To return to his lectures today is to find not a relic, but a provocation \u2014 a reminder that the hardest philosophical questions are always the ones that the powerful would prefer you not to ask.\"}],\"takeaways\":[\"Vitoria argued that all peoples, regardless of religion or culture, possess natural rights derived from universal rational nature \u2014 a foundation for international law.\",\"He dismantled the two main justifications for the Spanish conquest: papal temporal authority over non-Christians and the blanket application of Aristotelian natural slavery.\",\"His reconstruction of ius gentium (the law of nations) posited a universal moral order binding all human communities, above and beyond any single sovereign power.\",\"The tension in his work \u2014 between genuine rights-protection and providing new ideological cover for empire \u2014 remains one of the most contested questions in the philosophy of colonialism.\"]},\"counterTheories\":[{\"philosopher\":\"Juan Gin\u00e9s de Sep\u00falveda\",\"period\":\"c. 1489\u20131573\",\"school\":\"Renaissance Humanism / Aristotelian Political Philosophy\",\"argument\":[{\"type\":\"paragraph\",\"text\":\"Juan Gin\u00e9s de Sep\u00falveda, Vitoria's near-contemporary and the scholar who famously debated Bartolom\u00e9 de las Casas at Valladolid in 1550, offered the most direct and systematic rejection of Vitoria's universalism. Drawing more strictly on Aristotle's doctrine of natural slavery, Sep\u00falveda argued that the peoples of the Americas were, by observable evidence of their customs and social organization, examples of the \\\"natural slaves\\\" Aristotle described in the Politics \u2014 beings who lacked the full rational capacity for self-governance and who therefore benefited from being ruled by those more developed. This was not, he insisted, mere prejudice but a philosophical claim about the distribution of rational capacity across humanity, grounded in what he took to be empirical observation.\"},{\"type\":\"paragraph\",\"text\":\"Where Vitoria had argued that the practice of human sacrifice could at most justify a limited, proportionate intervention to protect the innocent, Sep\u00falveda argued it demonstrated the fundamental incapacity of these societies for genuine self-rule, justifying wholesale subjugation. He also maintained, against Vitoria's restriction of papal authority, that the Church's mission to spread salvation gave it \u2014 and by extension the Christian monarchs who served it \u2014 legitimate grounds for intervention in the affairs of non-Christian peoples. For Sep\u00falveda, the universal community that mattered was the community of those capable of full rational and moral life, and that community could not be extended to all human beings by mere assertion.\"},{\"type\":\"paragraph\",\"text\":\"Philosophically, Sep\u00falveda's challenge cuts at the empirical foundation of Vitoria's universalism. If universal natural rights rest on universal rational capacity, then the question of who actually possesses that capacity is not settled by philosophical argument alone \u2014 it requires something like anthropological evidence. Sep\u00falveda thought he had that evidence; Vitoria and Las Casas thought he was catastrophically wrong about what he was observing. This debate inaugurates a problem that has haunted liberal universalism ever since: the claim that universal rights apply to all humans can always be undermined by contested empirical claims about who counts as fully human in the relevant sense.\"}],\"contrast\":\"While Vitoria grounded universal rights in the rational nature shared by all humans, Sep\u00falveda argued that rational capacity was unequally distributed and that this inequality justified hierarchical domination.\"},{\"philosopher\":\"Carl Schmitt\",\"period\":\"1888\u20131985\",\"school\":\"Political Theology / Decisionism\",\"argument\":[{\"type\":\"paragraph\",\"text\":\"From a very different direction, the twentieth-century German jurist and philosopher Carl Schmitt mounted a devastating critique of the entire tradition of international law that Vitoria helped found. In his work \\\"The Nomos of the Earth\\\" (1950), Schmitt argued that the liberal vision of a universal moral order binding all nations was not a neutral philosophical discovery but a specific historical and political construction \u2014 one that, paradoxically, enabled rather than constrained imperial violence. By claiming that international law represented reason itself, European powers could wage wars against non-European peoples not as political conflicts between equals, but as police actions against those who stood outside civilization. The universalist framework did not abolish the distinction between the civilized and the uncivilized \u2014 it reframed it in the language of rights and law.\"},{\"type\":\"paragraph\",\"text\":\"For Schmitt, Vitoria's move was not liberation but the founding gesture of a new and more insidious imperialism. The truly honest political order, in Schmitt's view, acknowledges that law and morality are always grounded in a particular nomos \u2014 a historically specific ordering of space, power, and community \u2014 rather than in universal reason floating free of political interest. The pretense of universality conceals the particular sovereign will that actually decides what counts as a just war, who counts as a rational being with rights, and when intervention is permissible. Vitoria's careful distinctions between legitimate and illegitimate grounds for conquest were, on this reading, not constraints on power but instruments of it \u2014 a philosophical vocabulary that gave the powerful a more sophisticated way to do what they intended to do anyway.\"}],\"contrast\":\"Where Vitoria believed universal reason could generate genuine constraints on sovereign power, Schmitt argued that universalist legal frameworks inevitably serve as ideological cover for the hegemonic power that constructs and enforces them.\"}],\"whyItMatters\":{\"content\":[{\"type\":\"paragraph\",\"text\":\"Vitoria's philosophical project matters today not as a historical curiosity but as the site of a still-unresolved tension at the heart of international ethics. Every time we invoke human rights, invoke the \\\"responsibility to protect,\\\" or argue that sovereignty cannot shield governments from accountability for atrocities committed against their own people, we are working within a framework whose foundations Vitoria helped lay. But every time we notice that these frameworks are selectively applied \u2014 that powerful states invoke universal principles against weaker ones while exempting themselves \u2014 we are living inside the critique that Schmitt articulated. The question is not whether universal norms are a good idea in principle, but whether they can ever be genuinely universal in practice, or whether they are always, unavoidably, the norms of whoever currently holds the power to enforce them.\"},{\"type\":\"paragraph\",\"text\":\"What philosophy offers here is not a resolution but a sharpening of the question. Vitoria's lectures remind us that the most consequential philosophical work is often done not in abstract treatises about ideal worlds, but in the urgent, dangerous act of applying universal principles to specific, politically charged situations \u2014 of asking, in the face of power, whether what is being done can actually be justified. That act, and the intellectual courage it requires, is what places Vitoria in the small company of thinkers who changed not just how we think, but how we live.\"}]},\"philosopher\":{\"name\":\"Bartolom\u00e9 de las Casas\",\"lifespan\":\"1484\u20131566\",\"category\":\"Ethics & Political Philosophy\",\"bio\":\"Bartolom\u00e9 de las Casas was born in Seville in 1484, the son of a merchant who had sailed with Columbus on his second voyage to the Americas. Las Casas himself emigrated to Hispaniola in 1502, initially as a colonist and landowner who participated in the very system of forced Indigenous labor \u2014 the encomienda \u2014 that he would later spend his life fighting to abolish. His conversion to the cause of Indigenous rights came gradually but decisively, first inspired by the sermons of the Dominican friar Antonio de Montesinos in 1511, and fully realized in 1514 when, preparing a sermon, he read a passage in the book of Sirach about the offerings of the wicked and became convinced that his own treatment of his laborers rendered his religious practice a form of sacrilege. He freed his Indigenous workers, became a Dominican friar, and devoted the rest of his long life to advocacy, writing, and tireless political agitation on behalf of the peoples of the Americas.\\n\\nHis most famous work, \\\"A Short Account of the Destruction of the Indies\\\" (written c. 1542, published 1552), was a harrowing and deliberately polemical account of the violence of the Spanish conquest, addressed directly to the young Prince Philip. It was shocking in its specificity and its moral fury, and it became one of the most widely read and translated books of the sixteenth century \u2014 though it also gave rise to the \\\"Black Legend\\\" of Spanish cruelty that was enthusiastically exploited by Spain's Protestant rivals for their own imperial purposes. Las Casas was also the principal opponent of Sep\u00falveda at the great Valladolid debate of 1550\u201351, arguing on philosophical and theological grounds for the full rational and moral equality of the Indigenous peoples. In his later years he wrote the monumental \\\"History of the Indies\\\" and the provocative \\\"Apologia,\\\" both of which pushed his arguments to their furthest extent.\\n\\nLas Casas lived to the extraordinary age of eighty-two, dying in Madrid in 1566, and he remained philosophically active and politically contentious until near the end. His legacy is genuinely complicated: he was one of the earliest and most passionate advocates for Indigenous rights in recorded history, yet he also, in his early advocacy, proposed substituting African slave labor for Indigenous labor \u2014 a position he later repudiated with anguish, but which implicates him in the foundations of the transatlantic slave trade. His life embodies the painful truth that even the most sincere moral reformers are constrained and partially blinded by the assumptions of their time, and that the history of ethical progress is never a simple story of heroes and villains.\",\"image\":\"https://upload.wikimedia.org/wikipedia/commons/b/b9/Fray_Bartolom%C3%A9_de_las_Casas.jpg\",\"contributions\":\"Las Casas developed one of the earliest systematic philosophical and theological defenses of Indigenous rights and human equality, grounding his argument in natural law and the universal rational capacity of all human beings. He pioneered the use of eyewitness testimony and historical documentation as instruments of moral philosophy, insisting that abstract principles must be tested against the concrete reality of human suffering.\",\"rivals\":\"His primary intellectual rival was Juan Gin\u00e9s de Sep\u00falveda, with whom he debated directly at Valladolid over the moral status of the Indigenous peoples and the justice of the conquest. He also clashed repeatedly with colonial administrators, encomenderos, and even some within the Church who found his positions politically inconvenient.\"}}}]");

  ls("ph_vocab_v1", "[{\"id\":\"b1778510921636aekb\",\"word\":\"Inculcate\",\"definition\":\"To teach and impress an attitude, habit, or belief upon someone's mind through persistent, frequent repetition or instruction.\",\"book\":\"Why Nations Fail\"},{\"id\":\"b1778510763715a0ae\",\"word\":\"Malfeasance\",\"definition\":\"The intentional commission of a wrongful, unlawful, or dishonest act, particularly by a public official, corporate officer, or person in a position of trust.\",\"book\":\"Why Nations Fail\"},{\"id\":\"b1778508535914sumv\",\"word\":\"Posterity\",\"definition\":\"All future generations, or the collective descendants of a person.\",\"book\":\"N/A\"},{\"id\":\"b17785085018176vh9\",\"word\":\"Alabaster\",\"definition\":\"A soft, translucent mineral, typically white or banded, used for centuries in carving, sculpture, and interior decoration.\",\"book\":\"N/A\"},{\"id\":\"b1778508461329rneg\",\"word\":\"Pedagogue\",\"definition\":\"A teacher or educator, often defined by a strict, formal, or pedantic approach to instruction.\",\"book\":\"A Chip Shop in Poznan\"},{\"id\":\"b1778508419108bgz2\",\"word\":\"Gregarious\",\"definition\":\"Someone fond of company, sociable, and outgoing, often enjoying crowds and meeting new people.\",\"book\":\"A Chip Shop in Poznan\"},{\"id\":\"b1778508354800wn76\",\"word\":\"Mirthful\",\"definition\":\"Someone or something full of high-spirited joy, laughter, and amusement.\",\"book\":\"A Chip Shop in Poznan\"},{\"id\":\"b1778508319351hnsn\",\"word\":\"Eponymous\",\"definition\":\"Describes a person or entity that gives their name to a place, work, or brand (e.g. Walt Disney)\",\"book\":\"A Chip Shop in Poznan\"},{\"id\":\"b1778508271515i5gp\",\"word\":\"Imprecation\",\"definition\":\"A spoken curse, malediction, or the act of calling down evil, calamity, or wrath upon someone\",\"book\":\"A Chip Shop in Poznan\"},{\"id\":\"b1778402599167b6an\",\"word\":\"Sinuous\",\"definition\":\"Something characterized by many curves, bends, or turns, often describing a winding path, river, or a flexible, graceful movement.\",\"book\":\"N/A\"},{\"id\":\"b1778402558781nrls\",\"word\":\"Insolence\",\"definition\":\"Rude and disrespectful behaviour.\",\"book\":\"N/A\"},{\"id\":\"b17784020310976xgr\",\"word\":\"Voluptuous\",\"definition\":\"A person with a full, curved, and sexually attractive body, or something that provides, luxurious, sensual pleasure.\",\"book\":\"N/A\"},{\"id\":\"b1778335583296bq2e\",\"word\":\"Profligate\",\"definition\":\"Recklessly wasteful with resources (especially money) or shamelessly immoral and dissolute\",\"book\":\"Why Nations Fail\"},{\"id\":\"b1778245085880x4z6\",\"word\":\"Inimitable\",\"definition\":\"An adjective used to describe someone or something that is so unique, unusual, or of such high quality that it is impossible to copy or imitate.\",\"book\":\"The Art of Explanation\"},{\"id\":\"b1778187447116gj9p\",\"word\":\"Incandescence\",\"definition\":\"It can describe intense brilliance or extreme emotion, such as anger or joy\",\"book\":\"N/A\"},{\"id\":\"b1778187379450cjb9\",\"word\":\"Prostrate\",\"definition\":\"Lying flat on the ground, often face down, in submission, grief, or exhaustion\",\"book\":\"Why Nations Fail\"},{\"id\":\"b1778187323369l27c\",\"word\":\"Inimical\",\"definition\":\"A formal adjective describing something as harmful, hostile, or unfavorable.\",\"book\":\"Why Nations Fail\"},{\"id\":\"b17781872495857kgf\",\"word\":\"Sordid\",\"definition\":\"Filthy, wretchedly dirty, or morally vile and degrading, often highlighting disgusting, greedy, or dishonorable behavior\",\"book\":\"Why Nations Fail\"},{\"id\":\"b1778187190869b479\",\"word\":\"Abrogate\",\"definition\":\"To officially cancel, revoke, repeal, or annul a law, treaty, or formal agreement\",\"book\":\"Why Nations Fail\"},{\"id\":\"b1778161973545xmpu\",\"word\":\"Manorialism\",\"definition\":\"The medieval European system of land ownership where a lord held an estate (manor) and man
